<div style="padding: 30px;">
  <div style="margin-bottom: 40px;">
    <app-company-email-filter (filterOutput)="onApplyFilter($event)"></app-company-email-filter>
  </div>
  <div style="display: flex; justify-content: space-between;">
    <div style="">
      <button (click)="onPreviosPage()" matMiniFab style="margin-left: 20px;">
        <mat-icon fontIcon="keyboard_arrow_left"></mat-icon>
      </button>
      <button (click)="onNextPage()" matMiniFab style="margin-left: 5px;">
        <mat-icon fontIcon="keyboard_arrow_right"></mat-icon>
      </button>
    </div>
    <app-execute-campaign-button [filter]="emailSearchFilter()"></app-execute-campaign-button>
  </div>

  @if(emailsResource.isLoading()) {
    <div style="padding: 30px; margin-top: 30px;">
      <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    </div>
  } @else {
    @if (emailsResource.hasValue()) {
      Total: {{ emailsResource.value().total }}
      <mat-list>
        @for(email of emailsResource.value().list; track $index) {
          <mat-list-item>
            {{ email.id }} - {{ email.email }} - {{ email.count }}
          </mat-list-item>
        }
      </mat-list>
    }
  }
</div>
