<div style="padding: 50px;">
  <div style="display: flex; align-items: center; padding: 5px;">
    <button matButton="outlined" (click)="campaignResource.reload()">
      Reload
    </button>
    <button (click)="onPreviosPage()" matMiniFab style="margin-left: 20px;">
      <mat-icon fontIcon="keyboard_arrow_left"></mat-icon>
    </button>
    <button (click)="onNextPage()" matMiniFab style="margin-left: 5px;">
      <mat-icon fontIcon="keyboard_arrow_right"></mat-icon>
    </button>
  </div>
  @if (campaignResource.hasValue()) {
    <table mat-table [dataSource]="campaignResource.value()" class="mat-elevation-z8">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> ID </th>
        <td mat-cell *matCellDef="let element"> {{element.id}} </td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef> Description </th>
        <td mat-cell *matCellDef="let element"> {{element.description}} </td>
      </ng-container>

      <ng-container matColumnDef="template_name">
        <th mat-header-cell *matHeaderCellDef> Template </th>
        <td mat-cell *matCellDef="let element"> {{element.templateName}} </td>
      </ng-container>

      <!-- Weight Column -->
      <ng-container matColumnDef="created_at">
        <th mat-header-cell *matHeaderCellDef> Created At </th>
        <td mat-cell *matCellDef="let element"> {{element.createdAt | date: 'short'}} </td>
      </ng-container>

      <ng-container matColumnDef="row_count">
        <th mat-header-cell *matHeaderCellDef> N. of Comp. </th>
        <td mat-cell *matCellDef="let element"> {{element.rowCount}} </td>
      </ng-container>

      <ng-container matColumnDef="success">
        <th mat-header-cell *matHeaderCellDef> Success </th>
        <td mat-cell *matCellDef="let element"> {{element.success}} </td>
      </ng-container>

      <ng-container matColumnDef="failure">
        <th mat-header-cell *matHeaderCellDef> Failure </th>
        <td mat-cell *matCellDef="let element"> {{element.failure}} </td>
      </ng-container>

      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef> </th>
        <td mat-cell *matCellDef="let element">
          <!-- <a [routerLink]="[element.id]" matMiniFab> -->
          <!--   <mat-icon>more_horiz</mat-icon> -->
          <!-- </a> -->
          <button matIconButton [matMenuTriggerFor]="menu">
            <mat-icon>more_horiz</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <a [routerLink]="[element.id]" mat-menu-item>
              <mat-icon>troubleshoot</mat-icon>
              Details
            </a>
            <button mat-menu-item (click)="onUndo(element.id)">
              <mat-icon>warning_amber</mat-icon>
              Undo
            </button>
          </mat-menu>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  }
</div>
